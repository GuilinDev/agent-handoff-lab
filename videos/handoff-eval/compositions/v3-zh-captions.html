<!DOCTYPE html><html><body><template><style>@font-face{font-family:'Noto SC Local';src:url('assets/fonts/noto-sans-sc-v3.ttf') format('truetype');font-weight:500;font-style:normal}#root{position:relative;width:100%;height:100%}.cue{position:absolute;left:192px;top:874px;width:1536px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#183d34}.cue p{font-family:'Noto SC Local','Montserrat',sans-serif;font-size:36px;font-weight:500;line-height:1.3;margin:0;max-width:1470px}</style><div id="root" data-composition-id="v3-zh-captions" data-duration="58.13333333333333" data-width="1920" data-height="1080"><div id="v3-zh-captions-0" class="clip cue" data-start="0.500" data-duration="2.500"><p>任务成功了，就代表协作得好吗？</p></div><div id="v3-zh-captions-1" class="clip cue" data-start="3.413" data-duration="2.290"><p>我在 AgentWorld 里搭了个实验：</p></div><div id="v3-zh-captions-2" class="clip cue" data-start="5.713" data-duration="4.775"><p>让五个按固定策略行动的角色，合作做出镐、斧头和剑。</p></div><div id="v3-zh-captions-3" class="clip cue" data-start="10.900" data-duration="3.662"><p>我比较了三种情况：正常交付、只交一半煤，</p></div><div id="v3-zh-captions-4" class="clip cue" data-start="14.650" data-duration="2.938"><p>以及在此基础上延迟补煤请求。</p></div><div id="v3-zh-captions-5" class="clip cue" data-start="18.012" data-duration="3.375"><p>来看第三种：十份煤，我只让五份送到。</p></div><div id="v3-zh-captions-6" class="clip cue" data-start="21.787" data-duration="4.125"><p>冶炼者用完后请求补煤，我让消息晚到三个回合。</p></div><div id="v3-zh-captions-7" class="clip cue" data-start="26.337" data-duration="4.150"><p>供应者收到请求，补齐剩下的煤，生产才恢复。</p></div><div id="v3-zh-captions-8" class="clip cue" data-start="30.887" data-duration="2.600"><p>每种情况跑五次，全部成功。</p></div><div id="v3-zh-captions-9" class="clip cue" data-start="33.900" data-duration="4.762"><p>但正常情况平均只需五轮，两种干预叠加后要九轮。</p></div><div id="v3-zh-captions-10" class="clip cue" data-start="39.075" data-duration="4.437"><p>我的体会是，评估智能体，也要看交接和恢复成本。</p></div><div id="v3-zh-captions-11" class="clip cue" data-start="43.938" data-duration="4.612"><p>轨迹能告诉我们发生了什么，却不能揭示模型内部的推理。</p></div><div id="v3-zh-captions-12" class="clip cue" data-start="48.975" data-duration="4.000"><p>这版先验证测量工具，下一步再比较大模型策略。</p></div><div id="v3-zh-captions-13" class="clip cue" data-start="53.400" data-duration="2.900"><p>代码和运行记录，都在帖子链接里。</p></div></div><script>window.__timelines["v3-zh-captions"]=gsap.timeline({paused:true});</script></template></body></html>
