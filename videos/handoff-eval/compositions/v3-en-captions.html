<!DOCTYPE html><html><body><template><style>@font-face{font-family:'Noto SC Local';src:url('assets/fonts/noto-sans-sc-v3.ttf') format('truetype');font-weight:500;font-style:normal}#root{position:relative;width:100%;height:100%}.cue{position:absolute;left:192px;top:874px;width:1536px;height:96px;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#183d34}.cue p{font-family:'Montserrat',sans-serif;font-size:36px;font-weight:500;line-height:1.3;margin:0;max-width:1470px}</style><div id="root" data-composition-id="v3-en-captions" data-duration="56.0" data-width="1920" data-height="1080"><div id="v3-en-captions-0" class="clip cue" data-start="0.400" data-duration="1.850"><p>Does task success mean good teamwork?</p></div><div id="v3-en-captions-1" class="clip cue" data-start="2.920" data-duration="4.670"><p>I built an AgentWorld experiment: five scripted roles crafting a pickaxe, an axe,</p></div><div id="v3-en-captions-2" class="clip cue" data-start="7.600" data-duration="0.750"><p>and a sword.</p></div><div id="v3-en-captions-3" class="clip cue" data-start="9.020" data-duration="4.630"><p>I tested normal delivery, a coal shortage, and that shortage plus a delayed request.</p></div><div id="v3-en-captions-4" class="clip cue" data-start="14.220" data-duration="0.970"><p>Here&#x27;s the third case.</p></div><div id="v3-en-captions-5" class="clip cue" data-start="15.820" data-duration="1.810"><p>I deliver five coal instead of ten.</p></div><div id="v3-en-captions-6" class="clip cue" data-start="18.480" data-duration="2.130"><p>The smelter runs out and requests more.</p></div><div id="v3-en-captions-7" class="clip cue" data-start="21.200" data-duration="1.950"><p>I delay that message by three rounds.</p></div><div id="v3-en-captions-8" class="clip cue" data-start="23.780" data-duration="3.230"><p>Once it arrives, the supplier sends the rest, and work resumes.</p></div><div id="v3-en-captions-9" class="clip cue" data-start="27.020" data-duration="3.030"><p>Five runs per condition, all successful.</p></div><div id="v3-en-captions-10" class="clip cue" data-start="30.680" data-duration="4.730"><p>But average completion takes five rounds normally, versus nine with both disruptions.</p></div><div id="v3-en-captions-11" class="clip cue" data-start="36.140" data-duration="4.530"><p>My takeaway: evaluate handoffs and recovery alongside success.</p></div><div id="v3-en-captions-12" class="clip cue" data-start="40.860" data-duration="4.090"><p>Traces show what happened; they don&#x27;t reveal a model&#x27;s internal reasoning.</p></div><div id="v3-en-captions-13" class="clip cue" data-start="45.500" data-duration="2.470"><p>This scripted baseline tests the measurement setup.</p></div><div id="v3-en-captions-14" class="clip cue" data-start="48.560" data-duration="2.870"><p>Next, I&#x27;ll compare LLM policies.</p></div><div id="v3-en-captions-15" class="clip cue" data-start="52.260" data-duration="2.010"><p>Code and traces are linked in the post.</p></div></div><script>window.__timelines["v3-en-captions"]=gsap.timeline({paused:true});</script></template></body></html>
